# Logitech MX Keys in Mac mode, US keycaps, system layout UK (Mac).

[ids]
# USB receiver, Bluetooth
k:046d:408a
k:046d:b35b

include mac-common

[main]
# top-left `~ key: the UK Mac layout types § for it, ` is on 102nd
` = 102nd

[shift]
# £ -> #
3 = G-3

# layers match the physical key, so bind Cmd+` here too
[control]
` = A-f6

[app_switch_state:M]
` = S-M-tab

[control+shift]
` = S-A-f6
